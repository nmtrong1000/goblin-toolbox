openapi: 3.1.0
info:
  title: Goblin Toolbox - Markdown to PDF
  version: 0.1.0
  description: |
    Converts Markdown to a PDF and returns a temporary download URL.
    No authentication. Rate limited per IP by Vercel WAF.
    Requests over 4.49 MB may be rejected by the platform before this API runs.
servers:
  - url: /
paths:
  /api/tools/markdown-to-pdf:
    post:
      operationId: createPdf
      summary: Render Markdown to PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePdfRequest"
      responses:
        "200":
          description: PDF created. Local development returns the PDF directly when LOCAL_PDF_OUTPUT=1.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePdfResponse"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request or options
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Markdown or platform request size limit exceeded
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Rendering or storage failed
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: Rendering timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Vercel WAF rate limit; response body is platform-defined
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/tools/markdown-to-pdf/preview:
    post:
      operationId: preparePreview
      summary: Resolve public images for the live preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [markdown]
              properties:
                markdown:
                  type: string
                  maxLength: 100000
      responses:
        "200":
          description: Markdown with guarded images embedded as data URLs
          content:
            application/json:
              schema:
                type: object
                required: [markdown]
                properties:
                  markdown:
                    type: string
        "400":
          description: Invalid Markdown input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Too many images or aggregate image size exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Vercel WAF rate limit; response body is platform-defined
  /api/cron/markdown-to-pdf-cleanup:
    get:
      operationId: cleanupTemporaryPdfs
      summary: Delete expired Markdown to PDF files
      security:
        - cronBearer: []
      responses:
        "200":
          description: Expired files removed
        "401":
          description: CRON_SECRET is missing or invalid
components:
  securitySchemes:
    cronBearer:
      type: http
      scheme: bearer
  schemas:
    CreatePdfRequest:
      type: object
      additionalProperties: false
      required: [markdown, options]
      properties:
        markdown:
          type: string
          description: Markdown source, up to 100,000 characters. The whole request body must stay under the platform limit of about 4.5 MB.
          maxLength: 100000
        options:
          $ref: "#/components/schemas/Options"
    Options:
      type: object
      additionalProperties: false
      required: [pageSize, orientation, margin, pageNumbers, font, theme, colors, headingStyle]
      properties:
        pageSize:
          type: string
          enum: [A4, A5, Letter, Legal]
        orientation:
          type: string
          enum: [portrait, landscape]
        margin:
          type: string
          enum: [narrow, normal, wide]
          description: "narrow = 10 mm, normal = 20 mm, wide = 25 mm on every side. Ignored when customMargins is set."
        customMargins:
          $ref: "#/components/schemas/Margins"
        pageNumbers:
          type: boolean
          description: Shows the page number in the footer.
        pageNumberPosition:
          type: string
          enum: [left, center, right]
          default: center
          description: Where the page number sits in the footer, inside the left and right margins.
        pageNumberFormat:
          type: string
          enum: [current-total, current]
          default: current-total
          description: "current-total prints \"n / total\"; current prints \"n\"."
        font:
          type: string
          enum: [noto-sans, noto-serif]
        theme:
          type: string
          enum: [default, classic]
          description: "Text density. default = Comfortable (12 pt, line height 1.7); classic = Compact (10.5 pt, line height 1.4, tighter spacing)."
        colors:
          $ref: "#/components/schemas/Colors"
        headingStyle:
          type: string
          enum: [default, underline]
          description: "default = colored headings; underline = colored headings with a rule under H1 and H2."
    Colors:
      type: object
      additionalProperties: false
      required: [text, heading, link]
      properties:
        text:
          $ref: "#/components/schemas/HexColor"
        heading:
          $ref: "#/components/schemas/HexColor"
        link:
          $ref: "#/components/schemas/HexColor"
    HexColor:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
    Margins:
      type: object
      additionalProperties: false
      required: [top, right, bottom, left]
      description: Page margins in millimetres. Page numbers need a bottom margin of about 10 mm to show.
      properties:
        top:
          $ref: "#/components/schemas/MarginMm"
        right:
          $ref: "#/components/schemas/MarginMm"
        bottom:
          $ref: "#/components/schemas/MarginMm"
        left:
          $ref: "#/components/schemas/MarginMm"
    MarginMm:
      type: number
      minimum: 0
      maximum: 50
    CreatePdfResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: Public URL with a random name. The file is deleted after 1 hour.
        expiresAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable error code. The UI translates it; API clients should branch on it. Vercel answers 429 (WAF rate limit) and 413 (body over ~4.5 MB) itself, without this JSON body.
          enum: [INVALID_REQUEST, MARKDOWN_TOO_LONG, TOO_MANY_ASSETS, RENDER_TIMEOUT, RENDER_FAILED, STORAGE_FAILED, NOT_FOUND, INTERNAL_ERROR, UNAUTHORIZED, PAYLOAD_TOO_LARGE]
        message:
          type: string
          description: Human-readable English message.
