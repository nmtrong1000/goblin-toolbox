# Project-scoped filesystem permissions.
default_permissions = "settings"

[permissions.settings]
description = "Workspace access while denying access to common project secret files."
extends = ":workspace"

[permissions.settings.filesystem.":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
".envrc" = "deny"
".ssh" = "deny"
"secrets" = "deny"
".secrets" = "deny"
"*.pem" = "deny"
"*.key" = "deny"
